# ==============================================================================
# Leonardo 系统参数
# ==============================================================================

# ------------------------------------------------------------------------------
# 控制器管理器
# ------------------------------------------------------------------------------
leonardo/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fd_left_ee_controller:
      type: mtm_controllers/FDLeftEeController

    fd_right_ee_controller:
      type: mtm_controllers/FDRightEeController

    pedal_mapping_controller:
      type: teleop_controllers/Pedal6KeysMappingController

    aloe_controller:
      type: psm_controllers/AloeController

# ------------------------------------------------------------------------------
# 左侧力反馈设备末端控制器
# ------------------------------------------------------------------------------
leonardo/fd_left_ee_controller:
  ros__parameters:
    transform_translation: [0.0, 0.0, 0.0]
    transform_rotation: [0.0, 0.0, 0.0]
    joints:
      - fd_left_x
      - fd_left_y
      - fd_left_z
      - fd_left_roll
      - fd_left_pitch
      - fd_left_yaw
      - fd_left_gripper

# ------------------------------------------------------------------------------
# 右侧力反馈设备末端控制器
# ------------------------------------------------------------------------------
leonardo/fd_right_ee_controller:
  ros__parameters:
    transform_translation: [0.0, 0.0, 0.0]
    transform_rotation: [0.0, 0.0, 0.0]
    joints:
      - fd_right_x
      - fd_right_y
      - fd_right_z
      - fd_right_roll
      - fd_right_pitch
      - fd_right_yaw
      - fd_right_gripper

# ------------------------------------------------------------------------------
# 踏板发布节点
# ------------------------------------------------------------------------------
leonardo/pedal_publisher:
  ros__parameters:
    # 踏板设备（by-id 路径稳定，不随 event 号变化）
    device_path: /dev/input/by-id/usb-PCsensor_FS20Pro-event-kbd
    pedal_state_topic: /leonardo/pedal_state

# ------------------------------------------------------------------------------
# 踏板映射控制器
# ------------------------------------------------------------------------------
leonardo/pedal_mapping_controller:
  ros__parameters:
    left_prefix:  "fd_left_ee_controller/ee"
    right_prefix: "fd_right_ee_controller/ee"
    pedal_state_topic: /leonardo/pedal_state    
    teleop_mapping_topic: "/leonardo/pedal_mapping_cmd"

# ------------------------------------------------------------------------------
# 末端控制器（控制 psm_1、psm_2 、psm_3 从臂、 ecm_1内窥镜）
# ------------------------------------------------------------------------------
leonardo/aloe_controller:
  ros__parameters:
    teleop_sub_topic: "/leonardo/pedal_mapping_cmd"