# ==============================================================================
# Leonardo 系统参数
# ==============================================================================

# ------------------------------------------------------------------------------
# 控制器管理器
# ------------------------------------------------------------------------------
leonardo/controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    fd_left_ee_controller:
      type: mtm_controllers/FDLeftEeController

    fd_right_ee_controller:
      type: mtm_controllers/FDRightEeController

    arm_mapping_controller:
      type: teleop_controllers/ArmMappingController

    aloe_controller:
      type: psm_controllers/AloeController

# ------------------------------------------------------------------------------
# 左侧力反馈设备末端控制器
# ------------------------------------------------------------------------------
leonardo/fd_left_ee_controller:
  ros__parameters:
    transform_translation: [0.0, 0.0, 0.0]
    transform_rotation: [0.0, 0.0, 0.0]
    joints:
      - fd_left_x
      - fd_left_y
      - fd_left_z
      - fd_left_roll
      - fd_left_pitch
      - fd_left_yaw
      - fd_left_gripper

# ------------------------------------------------------------------------------
# 右侧力反馈设备末端控制器
# ------------------------------------------------------------------------------
leonardo/fd_right_ee_controller:
  ros__parameters:
    transform_translation: [0.0, 0.0, 0.0]
    transform_rotation: [0.0, 0.0, 0.0]
    joints:
      - fd_right_x
      - fd_right_y
      - fd_right_z
      - fd_right_roll
      - fd_right_pitch
      - fd_right_yaw
      - fd_right_gripper

# ------------------------------------------------------------------------------
# 踏板发布节点
# ------------------------------------------------------------------------------
leonardo/pedal_teleop_node:
  ros__parameters:    
    foot_pedal_path: /dev/input/by-id/usb-PCsensor_FS20Pro-event-kbd
    pedal_key_event_topic: /leonardo/foot_pedal/pedal_key_event

# ------------------------------------------------------------------------------
# 主从映射控制器
# ------------------------------------------------------------------------------
leonardo/arm_mapping_controller:
  ros__parameters:
    left_prefix: "fd_left_ee_controller/ee"
    right_prefix: "fd_right_ee_controller/ee"
    pedal_key_event_topic: /leonardo/foot_pedal/pedal_key_event
    arm_mapping_cmd_topic: /leonardo/arm_mapping/arm_mapping_cmd


# ------------------------------------------------------------------------------
# 末端控制器（控制 psm_1、psm_2 、psm_3 从臂、 ecm_1内窥镜）
# ------------------------------------------------------------------------------
leonardo/aloe_controller:
  ros__parameters:
    arm_mapping_cmd_topic: "/leonardo/arm_mapping/arm_mapping_cmd"