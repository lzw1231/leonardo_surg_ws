  ros__parameters:
    joints:
      - fd_right_x
      - fd_right_y
      - fd_right_z
      - fd_right_roll
      - fd_right_pitch
      - fd_right_yaw
#      - fd_right_gripper

leonardo/fd_right_ee_broadcaster:
  ros__parameters:
    pose_topic: /leonardo/fd_right_ee_pose
    button_topic: /leonardo/fd_right_button_state
    rpy_topic: /leonardo/fd_right_ee_rpy
    transform_translation: [ 0.0, 0.0, 0.0 ]
    transform_rotation: [ 0.0, 0.0, 0.0 ]
    joints:
      - fd_right_x
      - fd_right_y
      - fd_right_z
      - fd_right_roll
      - fd_right_pitch
      - fd_right_yaw
    buttons:
      - fd_right_button