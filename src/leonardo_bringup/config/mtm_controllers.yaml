# ==============================================================================
# MTM 控制器参数
# 命名空间：leonardo（和 leonardo_controller_manager.yaml 保持一致）
# ==============================================================================

# ==============================================================================
# Left arm
# ==============================================================================
leonardo/fd_left_effort_controller:
  ros__parameters:
    joints:
      - fd_left_x
      - fd_left_y
      - fd_left_z
      - fd_left_roll
      - fd_left_pitch
      - fd_left_yaw
#      - fd_left_gripper

leonardo/fd_left_ee_broadcaster:
  ros__parameters:
    pose_topic: /leonardo/fd_left_ee_pose
    button_topic: /leonardo/fd_left_button_state
    rpy_topic: /leonardo/fd_left_ee_rpy
    transform_translation: [ 0.0, 0.0, 0.0 ]
    transform_rotation: [ 0.0, 0.0, 0.0 ]
    joints:
      - fd_left_x
      - fd_left_y
      - fd_left_z
      - fd_left_roll
      - fd_left_pitch
      - fd_left_yaw
    buttons:
      - fd_left_button

# ==============================================================================
# Right arm
# ==============================================================================
