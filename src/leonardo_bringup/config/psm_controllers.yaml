# ==============================================================================
# PSM 控制器参数
# 命名空间：leonardo（和 leonardo_controller_manager.yaml 保持一致）
# ==============================================================================

# ==============================================================================
# FT3215 控制器 A：控制前 3 个关节
# ==============================================================================
leonardo/ft3215_controller_a:
  ros__parameters:
    topic: /leonardo/pedal_a
    interface_name: position
    coefficient: 1.0
    joints:
      - joint_ft_11_12
      - joint_ft_12_13
      - joint_ft_13_14

# ==============================================================================
# FT3215 控制器 B：控制后 3 个关节
# ==============================================================================
leonardo/ft3215_controller_b:
  ros__parameters:
    topic: /leonardo/pedal_b
    interface_name: position
    coefficient: 1.0
    joints:
      - joint_ft_14_15
      - joint_ft_15_16
      - joint_ft_16_17