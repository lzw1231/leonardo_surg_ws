# ==============================================================================
# 遥操作辅助节点参数
# ==============================================================================

leonardo/topic_router:
  ros__parameters:
    # 输入话题（和 mtm_controllers.yaml 里的 rpy_topic 对齐）
    left_topic: /leonardo/fd_left_ee_rpy
    right_topic: /leonardo/fd_right_ee_rpy

    # 输出话题（和 psm_controllers.yaml 里的 topic 对齐）
    pedal_a_topic: /leonardo/pedal_a
    pedal_b_topic: /leonardo/pedal_b

    # 踏板设备（by-id 路径稳定，不随 event 号变化）
    device_path: /dev/input/by-id/usb-PCsensor_FS20Pro-event-kbd