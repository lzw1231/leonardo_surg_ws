services:
  app:
    image: ros2-dev:latest
    privileged: true
    network_mode: host
    hostname: ros2-dev
    working_dir: /workspace
    command: bash -c "/usr/local/bin/start-xpra.sh && exec sleep infinity"
    volumes:
      - ..:/workspace:cached
      - /dev:/dev
      - ../omp.json:/root/omp.json
    environment:
      DISPLAY: ":10"
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      OGRE_RTT_MODE: "Copy"
      QT_ENABLE_HIGHDPI_SCALING: "0"
      QT_AUTO_SCREEN_SCALE_FACTOR: "0"
      QT_SCREEN_SCALE_FACTORS: "1"
      ROS_DOMAIN_ID: "0"
      RCUTILS_COLORIZED_OUTPUT: "1"
