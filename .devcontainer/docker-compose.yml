services:
  ros2_dev_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2_dev:latest
    command: [ "/bin/bash", "-c", "exec sleep infinity" ]
    privileged: true
    network_mode: host
    hostname: ros2_dev
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - /dev:/dev
      - ./scripts/oh_my_posh.json:/root/oh_my_posh.json
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      OGRE_RTT_MODE: "Copy"
      ROS_DOMAIN_ID: "0"
      RCUTILS_COLORIZED_OUTPUT: "1"
