services:
  ros2_dev_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros2_dev:latest
    command: [ "/bin/bash", "-c", "/usr/local/bin/start_xpra.sh > /tmp/start.log 2>&1; exec sleep infinity" ]
    privileged: true
    network_mode: host
    hostname: ros2_dev
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - /dev:/dev
      - ./scripts/oh_my_posh.json:/root/oh_my_posh.json
    environment:
      DISPLAY: ":10"
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      OGRE_RTT_MODE: "Copy"
      QT_ENABLE_HIGHDPI_SCALING: "0"
      QT_AUTO_SCREEN_SCALE_FACTOR: "0"
      QT_SCREEN_SCALE_FACTORS: "1"
      ROS_DOMAIN_ID: "0"
      RCUTILS_COLORIZED_OUTPUT: "1"
